name: jarvis2-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install -r requirements-dev.txt

      - name: Run pytest (full suite incl. parallel-safe)
        run: python3 -m pytest tests/ -q

      - name: Compile all root + legacy modules
        run: python3 -m compileall -q *.py legacy/*.py skills/*.py tests/*.py

      - name: Run smoke tests
        run: python3 tests/test_smoke.py

      - name: Run Mission-5 self-tests
        run: python3 test_mission_5.py
